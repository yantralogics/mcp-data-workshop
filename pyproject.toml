[project]
name = "mcp-data-workshop"
version = "1.0.0"
description = "45-minute hands-on workshop: build an MCP server over a SQLite sales dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1,<5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
